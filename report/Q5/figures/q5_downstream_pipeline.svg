<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
<title>Evidence preparation and answer checking / 证据准备与答案校验</title>
<desc>Query constraints lead to full-pool statistics and balanced retrieved examples. Both support a grounded draft, followed by validation, one repair attempt, and fallback if necessary.</desc>
<rect width="1600" height="620" fill="white"/>
<text x="800" y="36" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" fill="#18334d">Evidence preparation and answer checking</text>
<text x="800" y="78" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" fill="#41576b">证据准备与答案校验</text>
<rect x="30" y="195" width="220" height="230" rx="18" fill="#f2f5f8" stroke="#c4d2de" stroke-width="2"/>
<text x="140" y="237" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#18334d">Query</text>
<text x="140" y="278" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#18334d">问题与筛选条件</text>
<text x="140" y="328" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#41576b">Airline / cabin</text>
<text x="140" y="367" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#41576b">Route / date</text>
<rect x="300" y="105" width="500" height="405" rx="18" fill="#f2f7fc" stroke="#c4d2de" stroke-width="2"/>
<text x="550" y="139" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#18334d">Prepare evidence</text>
<text x="550" y="178" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#18334d">准备证据</text>
<rect x="320" y="207" width="460" height="120" rx="12" fill="white" stroke="#c4d2de" stroke-width="2"/>
<text x="550" y="231" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#18334d">Full direct-match pool</text>
<text x="550" y="269" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#18334d">Review-level statistics</text>
<text x="550" y="305" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#41576b">完整直接匹配池 → 评论级统计</text>
<rect x="320" y="348" width="460" height="120" rx="12" fill="white" stroke="#c4d2de" stroke-width="2"/>
<text x="550" y="372" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#18334d">Retrieved candidates</text>
<text x="550" y="410" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#18334d">Balanced examples</text>
<text x="550" y="446" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#41576b">检索候选 → 正反平衡选例</text>
<rect x="850" y="195" width="260" height="230" rx="18" fill="#edf6f5" stroke="#c4d2de" stroke-width="2"/>
<text x="980" y="248" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#18334d">Grounded draft</text>
<text x="980" y="295" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#18334d">依据证据生成初稿</text>
<text x="980" y="355" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#41576b">Passages + aggregates</text>
<rect x="1160" y="105" width="410" height="405" rx="18" fill="#faf5ec" stroke="#c4d2de" stroke-width="2"/>
<text x="1365" y="141" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#18334d">Check and return</text>
<text x="1365" y="180" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#18334d">校验后返回答案</text>
<text x="1365" y="238" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#18334d">Pass → return draft</text>
<text x="1365" y="275" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#41576b">通过 → 返回初稿</text>
<text x="1365" y="333" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#18334d">Fail → repair once</text>
<text x="1365" y="370" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#41576b">失败 → 修正一次</text>
<text x="1365" y="428" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#18334d">Fail again → fallback</text>
<text x="1365" y="465" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#41576b">仍失败 → 程序回退</text>
<path d="M255 310 H281" fill="none" stroke="#275d89" stroke-width="4"/><path d="M290 310 L277 302 L277 318 Z" fill="#275d89"/>
<path d="M805 310 H831" fill="none" stroke="#275d89" stroke-width="4"/><path d="M840 310 L827 302 L827 318 Z" fill="#275d89"/>
<path d="M1115 310 H1141" fill="none" stroke="#275d89" stroke-width="4"/><path d="M1150 310 L1137 302 L1137 318 Z" fill="#275d89"/>
<text x="800" y="554" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#18334d">Statistics describe the pool; quotations illustrate experiences.</text>
<text x="800" y="594" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#41576b">总体统计与少量引用分工，二者使用相同查询约束。</text>
</svg>
